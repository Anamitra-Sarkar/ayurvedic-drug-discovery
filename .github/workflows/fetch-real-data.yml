name: Fetch Real Data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run real data fetch (PubChem, RCSB PDB, Europe PMC)
        run: python3 scripts/fetch_real_data.py

      - name: Commit and push fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: real PubChem/RCSB-PDB/Europe-PMC fetch via GitHub Actions (fetched entirely in CI, see docs/DATA_PROVENANCE.md)"
            git push
          fi
